schema_version: "1.0"

extension:
  id: "jira"
  name: "Jira Integration"
  version: "1.2.0"
  description: "Three-tier Jira hierarchy (Epic → Story → Sub-task) from spec tasks, with dry-run preview and improved title formatting"
  author: "Patrick Fowler"
  repository: "https://github.com/pdfowler/spec-kit-jira"
  homepage: "https://github.com/pdfowler/spec-kit-jira"
  license: "MIT"

requires:
  speckit_version: ">=0.8.3"
  tools:
    - name: "Atlassian MCP"
      required: true
      version: ">=1.0.0"
  commands:
    - "speckit.tasks"
    - "speckit.implement"

provides:
  commands:
    - name: "speckit.jira.taskstotickets"
      file: "commands/taskstotickets.md"
      description: "Convert tasks into a three-tier Epic → Story → Sub-task hierarchy with dry-run preview"

    - name: "speckit.jira.implement"
      file: "commands/implement.md"
      description: "Execute implementation scoped to a single Jira Story's tasks; closes Sub-tasks and Story as work completes"

hooks:
  after_tasks:
    command: "speckit.jira.taskstotickets"
    optional: true
    prompt: "Create Jira tickets for the generated tasks?"

tags:
  - "jira"
  - "atlassian"
  - "project-management"
  - "issue-tracking"
