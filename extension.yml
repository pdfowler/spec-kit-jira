schema_version: "1.0"

extension:
  id: "jira"
  name: "Jira Integration"
  version: "1.4.0"
  description: "Convert spec tasks into Jira tickets with dry-run preview and configurable progress recording"
  author: "Patrick Fowler"
  repository: "https://github.com/pdfowler/spec-kit-jira"
  homepage: "https://github.com/pdfowler/spec-kit-jira"
  license: "MIT"

requires:
  speckit_version: ">=0.8.3"
  tools:
    - name: "Atlassian MCP"
      required: true
      description: "Atlassian Remote MCP Server — provides Jira Cloud read/write access"

provides:
  commands:
    - name: "speckit.jira.taskstotickets"
      file: "commands/taskstotickets.md"
      description: "Convert tasks.md phases into Jira tickets (Epic → Story → Sub-task) with mandatory preview before any writes; supports --dry-run"

    - name: "speckit.jira.implement"
      file: "commands/implement.md"
      description: "Run implementation scoped to a phase ticket; records Jira progress using configurable gates"

hooks:
  after_tasks:
    command: "speckit.jira.taskstotickets"
    optional: true
    prompt: "Create Jira tickets for the generated tasks?"

tags:
  - "jira"
  - "atlassian"
  - "project-management"
  - "issue-tracking"
