# Jira Integration Configuration
#
# Copy to:
#
#   .specify/extensions/jira/jira-config.yml
#
# for repository-wide settings, or:
#
#   .specify/extensions/jira/local-config.yml
#
# for machine-local overrides. This extension also reads an optional user-global
# file at $HOME/.specify/extensions/jira/jira-config.yml before repository config.

schema_version: "2.0"

jira:
  phase_dependencies:
    # Create Jira "Blocks" issue links from jira-map.md Phase Dependencies during apply.
    create_blocks_links_on_apply: true

    # Controls when a phase blocked by another phase may START implementation.
    # This is intentionally separate from when the blocker can be marked Done.
    #
    # Options:
    # - semantic_status_at_least: blocker Jira status must be at least `status`
    # - tasks_complete: blocker Task IDs must all be checked in tasks.md
    # - done: blocker Jira semantic status must be done
    # - none: report dependencies but never stop implementation
    start_when_blocker:
      mode: "semantic_status_at_least"
      status: "in_review"

    # Options: stop, warn
    on_blocker_not_satisfied: "stop"

  progress_policy:
    # Semantic statuses are mapped to the actual status names in a Jira project.
    semantic_statuses:
      todo:
        - "To Do"
        - "Backlog"
      in_progress:
        - "In Progress"
        - "Selected for Development"
      in_review:
        - "In Review"
        - "Code Review"
        - "Review"
      done:
        - "Done"
        - "Closed"
        - "Resolved"

    monotonic: true
    on_missing_transition: "warn"

    draft_pr_counts_as_review: false
    require_remote_push_for_phase_review: true

    # Phase Done remains stricter than phase implementation readiness by default.
    # Options: pr_merged, remote_checks_passed, local_gates_passed, explicit_confirm
    phase_done_gate: "pr_merged"

    # Options: committed, local_gates_passed, remote_checks_passed, explicit_confirm
    subtask_done_gate: "local_gates_passed"

    test_tasks:
      match:
        - "test"
        - "failing test"
        - "coverage"
        - "contract test"
      on_commit: "in_review"
      done_gate: "local_gates_passed"

    implementation_tasks:
      on_commit: "in_review"
      done_gate: "local_gates_passed"

    documentation_tasks:
      match:
        - "docs"
        - "documentation"
        - "readme"
      on_commit: "done"
      done_gate: "committed"

    transitions:
      on_phase_start:
        issue: "phase"
        to: "in_progress"
        only_from:
          - "todo"

      on_task_start:
        issue: "subtask"
        to: "in_progress"
        only_from:
          - "todo"

      on_task_commit:
        issue: "subtask"
        to: "in_review"
        only_from:
          - "todo"
          - "in_progress"

      on_task_local_gates_passed:
        issue: "subtask"
        to: "done"
        only_from:
          - "todo"
          - "in_progress"
          - "in_review"

      on_remote_checks_passed:
        issue: "subtask"
        to: "done"
        only_from:
          - "in_progress"
          - "in_review"

      on_pr_opened:
        issue: "phase"
        to: "in_review"
        only_from:
          - "todo"
          - "in_progress"

      on_pr_merged:
        issue: "phase"
        to: "done"
        only_from:
          - "in_review"

    commits:
      required_before_task_review: true
      required_before_phase_review: true
      stage_files_explicitly: true
      conventional_commit: true
      include_jira_key: true

    local_gates:
      required_before_subtask_done: true
      required_before_phase_review: true
      commands: []

    pull_requests:
      required_before_phase_review: true
      draft_counts_as_review: false
      required_before_phase_done: true
      merge_required_for_phase_done: true

    safety:
      never_transition_done_backward: true
      do_not_close_phase_with_uncommitted_changes: true
      do_not_close_phase_without_validation: true
      do_not_close_phase_without_pr_unless_configured: true
